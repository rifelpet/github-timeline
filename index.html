<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Issue &amp; PR Timeline</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-basic-3.7.0.min.js" defer></script>
  <script src="timeline.js" defer></script>
</head>
<body>
  <main>
    <h1>GitHub Issue &amp; PR Timeline</h1>

    <form id="controls" class="controls">
      <div class="control">
        <label for="reposelect">Repository</label>
        <select id="reposelect"></select>
      </div>
      <div class="control">
        <label><input type="checkbox" id="logscale"> Log scale</label>
      </div>
      <details id="compare" class="compare">
        <summary>Compare with other repositories</summary>
        <fieldset id="comparelist">
          <legend class="visually-hidden">Repositories to overlay</legend>
        </fieldset>
      </details>
    </form>

    <p class="hint">Add more repos to this list by opening a <a href="https://github.com/rifelpet/github-timeline">pull request</a>.</p>

    <h2 id="charttitle" class="chart-title"></h2>
    <p id="updated" class="updated"></p>
    <div id="messages" class="messages" role="status" aria-live="polite"></div>
    <div id="graph" class="graph"></div>
  </main>
</body>
</html>
