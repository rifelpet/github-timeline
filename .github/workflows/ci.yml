name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Only the latest push to a PR matters, so cancel superseded runs there.
# Let every push to main finish so each commit gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Go vet, test, and build
    runs-on: ubuntu-latest
    steps:
    - name: Check out this repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    - name: Vet
      run: go vet ./...
    - name: Test
      run: go test ./...
    - name: Build
      run: go build -o /dev/null .

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
    - name: Check out this repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Check JavaScript syntax
      run: node --check timeline.js
    # Renovate bumps the CDN URLs in index.html; make sure each one resolves
    # before an update is merged.
    - name: Check the CDN scripts exist
      run: |-
        grep -o 'https://cdn\.plot\.ly/[^"]*' index.html | while read -r url; do
          echo "${url}"
          curl -fsSI "${url}" > /dev/null
        done
