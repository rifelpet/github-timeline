name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Check out this repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Vet
      run: go vet ./...
    - name: Test
      run: go test ./...
    - name: Build
      run: go build -o /dev/null .

  frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Check out this repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Check JavaScript syntax
      run: node --check timeline.js
    # Renovate bumps the CDN URLs in index.html; make sure each one resolves
    # before an update is merged.
    - name: Check the CDN scripts exist
      run: |-
        grep -o 'https://cdn\.plot\.ly/[^"]*' index.html | while read -r url; do
          echo "${url}"
          curl -fsSI "${url}" > /dev/null
        done
