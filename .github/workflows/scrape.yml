name: Scrape latest data

on:
  schedule:
    - cron:  '15 1 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Download every issue and PR of every repo instead of only what changed, and reconcile the cache against it'
        type: boolean
        default: false

permissions:
  contents: write

# Never run two scrapes at once: they would race on the cache and the data
# commit. Queue instead of cancelling so a manual run doesn't kill a
# scheduled one mid-fetch.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Check out this repo
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Build scraper
      run: go build -o scraper .
    # Cache keys are immutable, so each run saves under a new key and the
    # next run restores the most recent one via the prefix.
    - name: Restore issue cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: cache
        key: scrape-cache-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: scrape-cache-
    - name: Fetch latest data
      env:
        GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        FULL: ${{ inputs.full }}
      run: |-
        args=()
        if [ "${FULL}" = "true" ]; then
          args+=(-full)
        fi
        rc=0
        # Sequential on purpose: parallel scrapes have hit API rate limits.
        for repo in $(jq -r '.[]' repos.json); do
          echo "::group::Fetching ${repo}"
          if ! ./scraper "${args[@]}" "${repo}"; then
            echo "::warning::failed to fetch ${repo}"
            rc=1
          fi
          echo "::endgroup::"
        done
        # Exit non-zero if any repo failed so the run is flagged, but only after
        # attempting every repo. The cache and commit steps run regardless.
        exit $rc
    # Save even if some repos failed, so the ones that succeeded keep their
    # progress.
    - name: Save issue cache
      if: always() && hashFiles('cache/**') != ''
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: cache
        key: scrape-cache-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Commit and push if it changed
      if: always()
      run: |-
        git config user.name "github bot"
        git config user.email "actions@users.noreply.github.com"
        git add -A data
        timestamp=$(date -u)
        git commit -m "Data update: ${timestamp}" || exit 0
        # A scrape takes long enough that other commits often land on the
        # branch meanwhile; rebase onto them rather than losing the whole run.
        for attempt in 1 2 3; do
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
          sleep $((attempt * 10))
        done
        exit 1
